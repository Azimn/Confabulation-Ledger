[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confabulation-ledger"
version = "0.1.0"
description = "An auditable canon formation experiment for fictional character claims"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Azimn research project"}]
dependencies = []

[project.scripts]
confab-ledger = "confab_ledger.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
confab_ledger = ["static/*.html"]
